l="#191d23" stroke="rgba(197,186,196,.16)"/><text x="360" y="228" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#e0a8d6" font-weight="600" text-anchor="middle">pose_annotator.py</text></g><g class="up" style="animation-delay:0.30s"><circle cx="600" cy="92" r="34" fill="#262c34" stroke="#a8eee3" stroke-width="2"/><text x="600" y="103" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#a8eee3" font-weight="800" text-anchor="middle" letter-spacing="-1">03</text><text x="600" y="160" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f1eff1" font-weight="800" text-anchor="middle">Huấn luyện PoseNet</text><text x="600" y="186" font-family="Cambria, 'Noto Serif', 'Times New Roman', serif" font-size="15" fill="#c5bac4" text-anchor="middle" font-style="italic">heatmap regression</text><rect x="502" y="208" width="196" height="30" rx="8" fill="#191d23" stroke="rgba(197,186,196,.16)"/><text x="600" y="228" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#a8eee3" font-weight="600" text-anchor="middle">pose_model.py train</text></g><g class="up" style="animation-delay:0.45s"><circle cx="840" cy="92" r="34" fill="#262c34" stroke="#7fc4d4" stroke-width="2"/><text x="840" y="103" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#7fc4d4" font-weight="800" text-anchor="middle" letter-spacing="-1">04</text><text x="840" y="160" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f1eff1" font-weight="800" text-anchor="middle">Cắt clip động tác</text><text x="840" y="186" font-family="Cambria, 'Noto Serif', 'Times New Roman', serif" font-size="15" fill="#c5bac4" text-anchor="middle" font-style="italic">chuỗi 32 khung</text><rect x="742" y="208" width="196" height="30" rx="8" fill="#191d23" stroke="rgba(197,18