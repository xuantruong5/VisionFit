<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="404" viewBox="0 0 1200 404" role="img" aria-label="Module 03 — Backend trung tâm Laravel 12: Sanctum, Reverb, quản lý gym, thanh toán."><title>Module 03 — Backend trung tâm Laravel 12: Sanctum, Reverb, quản lý gym, thanh toán.</title><style>
@media (prefers-reduced-motion: reduce){*{animation:none!important}.up{opacity:1!important}.bar,.grow{transform:none!important}}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
