<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Vấn đề: tập sai tư thế không ai sửa. Giải pháp: một camera, một hệ sinh thái. Kết quả: tập đúng hơn, vận hành nhẹ hơn."><title>Vấn đề: tập sai tư thế không ai sửa. Giải pháp: một camera, một hệ sinh thái. Kết quả: tập đúng hơn, vận hành nhẹ hơn.</title><style>
@media (prefers-reduced-motion: reduce){*{animation:none!important}.up{opacity:1!important}.bar,.grow{transform:none!important}}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.flow{stroke-dasharray:6 8;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:bar 1.2s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes bar{to{transform:scaleX(1)}}
.grow{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.orb{animation:orb 12s ease-in-out infinite alternate}
@keyframes orb{to{transform:translate(-60px,40px)}}
.scan{animation:scan 3.2s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(330px)}}
.caret{animation:pulse 1s steps(1) infinite}
</style><g class="up" style="animation-delay:0.00s"><rect x="0" y="0" width="388" height="300" rx="22" fill="#1f242b" stroke="rgba(197,186,196,.16)"/><circle cx="36" cy="42" r="6" fill="#7fc4d4" class="pulse"/><text x="52" y="47" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#7fc4d4" font-weight="700" letter-spacing="3">VẤN ĐỀ</text><text x="28" y="104" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#f1eff1" font-weight="800" letter-spacing="-0.5">Tập sai tư thế, không ai sửa.</text><rect class="bar" style="animation-delay:0.40s" x="28" y="126" width="332" height="3" rx="1.5" fill="#7fc4d4"/><text x="28" y="172" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#a3a8b4">Người tập tự học thiếu phản hồi kỹ thuật;</text><text x="28" y="202" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#a3a8b4">cảm biến đeo người thì đắt và bất tiện;</text><text x="28" y="232" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#a3a8b4">phòng gym vẫn quản lý bằng sổ và Excel.</text></g><path d="M394,150 l10,0 m-5,-5 l5,5 l-5,5" stroke="#c5bac4" stroke-opacity=".5" fill="none" stroke-width="2"/><g class="up" style="animation-delay:0.15s"><rect x="406" y="0" width="388" height="300" rx="22" fill="#1f242b" stroke="rgba(197,186,196,.16)"/><circle cx="442" cy="42" r="6" fill="#e0a8d6" class="pulse"/><text x="458" y="47" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e0a8d6" font-weight="700" letter-spacing="3">GIẢI PHÁP</text><text x="434" y="104" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#f1eff1" font-weight="800" letter-spacing="-0.5">Một camera, một hệ sinh thái.</text><rect class="bar" style="animation-delay:0.55s" x="434" y="126" width="332" height="3" rx="1.5" fill="#e0a8d6"/><text x="434" y="172" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#a3a8b4">Ước lượng 33 khớp, nhận diện động tác,</text><text x="434" y="202" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#a3a8b4">đếm rep và chấm góc sinh cơ học —</text><text x="434" y="232" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#a3a8b4">nối liền Hội viên, PT và Ban quản lý.</text></g><path d="M800,150 l10,0 m-5,-5 l5,5 l-5,5" stroke="#c5bac4" stroke-opacity=".5" fill="none" stroke-width="2"/><g class="up" style="animation-delay:0.30s"><rect x="812" y="0" width="388" height="300" rx="22" fill="#1f242b" stroke="rgba(197,186,196,.16)"/><circle cx="848" cy="42" r="6" fill="#a8eee3" class="pulse"/><text x="864" y="47" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" fill="#a8eee3" font-weight="700" letter-spacing="3">KẾT QUẢ</text><text x="840" y="104" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="23" fill="#f1eff1" font-weight="800" letter-spacing="-0.5">Tập đúng hơn, vận hành nhẹ hơn.</text><rect class="bar" style="animation-delay:0.70s" x="840" y="126" width="332" height="3" rx="1.5" fill="#a8eee3"/><text x="840" y="172" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#a3a8b4">Cảnh báo sai tư thế kể cả khi bị che khuất;</text><text x="840" y="202" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#a3a8b4">trợ lý VIF trả lời bằng dữ liệu thật;</text><text x="840" y="232" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15.5" fill="#a3a8b4">lịch, gói tập, doanh thu trên một nền tảng.</text></g></svg>