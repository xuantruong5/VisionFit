<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="33 điểm khớp · 5 phân hệ · 9 công cụ AI · 3 vai trò người dùng"><title>33 điểm khớp · 5 phân hệ · 9 công cụ AI · 3 vai trò người dùng</title><style>
@media (prefers-reduced-motion: reduce){*{animation:none!important}.up{opacity:1!important}.bar,.grow{transform:none!important}}
.up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.flow{stroke-dasharray:6 8;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:bar 1.2s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes bar{to{transform:scaleX(1)}}
.grow{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.float{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.orb{animation:orb 12s ease-in-out infinite alternate}
@keyframes orb{to{transform:translate(-60px,40px)}}
.scan{animation:scan 3.2s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(330px)}}
.caret{animation:pulse 1s steps(1) infinite}
</style><g class="up" style="animation-delay:0.00s"><rect x="0" y="0" width="285" height="250" rx="22" fill="#1f242b" stroke="rgba(197,186,196,.16)"/><text x="28" y="104" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="78" fill="#f1eff1" font-weight="800" letter-spacing="-3">33</text><rect class="bar" style="animation-delay:0.40s" x="28" y="124" width="229" height="3" rx="1.5" fill="#7fc4d4"/><text x="28" y="160" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f1eff1" font-weight="700">Điểm khớp mỗi khung</text><text x="28" y="190" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#a3a8b4">PoseNet hồi quy heatmap,</text><text x="28" y="212" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#a3a8b4">chuẩn hóa tâm hông &amp; thân.</text></g><g class="up" style="animation-delay:0.15s"><rect x="305" y="0" width="285" height="250" rx="22" fill="#1f242b" stroke="rgba(197,186,196,.16)"/><text x="333" y="104" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="78" fill="#f1eff1" font-weight="800" letter-spacing="-3">05</text><rect class="bar" style="animation-delay:0.55s" x="333" y="124" width="229" height="3" rx="1.5" fill="#e0a8d6"/><text x="333" y="160" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f1eff1" font-weight="700">Phân hệ</text><text x="333" y="190" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#a3a8b4">AI core, trợ lý VIF, backend,</text><text x="333" y="212" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#a3a8b4">app di động, web quản trị.</text></g><g class="up" style="animation-delay:0.30s"><rect x="610" y="0" width="285" height="250" rx="22" fill="#1f242b" stroke="rgba(197,186,196,.16)"/><text x="638" y="104" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="78" fill="#f1eff1" font-weight="800" letter-spacing="-3">09</text><rect class="bar" style="animation-delay:0.70s" x="638" y="124" width="229" height="3" rx="1.5" fill="#c5bac4"/><text x="638" y="160" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f1eff1" font-weight="700">Công cụ AI thật</text><text x="638" y="190" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#a3a8b4">Gemini Function Calling gọi</text><text x="638" y="212" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#a3a8b4">thẳng dữ liệu phòng tập.</text></g><g class="up" style="animation-delay:0.45s"><rect x="915" y="0" width="285" height="250" rx="22" fill="#1f242b" stroke="rgba(197,186,196,.16)"/><text x="943" y="104" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="78" fill="#f1eff1" font-weight="800" letter-spacing="-3">03</text><rect class="bar" style="animation-delay:0.85s" x="943" y="124" width="229" height="3" rx="1.5" fill="#a8eee3"/><text x="943" y="160" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#f1eff1" font-weight="700">Vai trò người dùng</text><text x="943" y="190" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#a3a8b4">Hội viên, Huấn luyện viên</text><text x="943" y="212" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14.5" fill="#a3a8b4">và Ban quản lý.</text></g></svg>