# ─────────────────────────────────────────────────────────────────────────────
# VisionFit backend chạy bằng XAMPP Apache (Windows) — thay cho `php artisan serve`
#
# `php artisan serve` chỉ xử lý 1 request mỗi lúc; Apache trên Windows (mpm_winnt)
# xử lý song song tới 150 request (ThreadsPerChild trong conf/extra/httpd-mpm.conf).
#
# Cách bật (một lần), xem deploy/README.md:
#   Thêm 2 dòng vào cuối C:\xampp\apache\conf\extra\httpd-vhosts.conf:
#     Define VISIONFIT_BACKEND "D:/NCKH/VisionFit/modules/backend/visionfit"
#     Include "${VISIONFIT_BACKEND}/deploy/apache/visionfit-xampp.conf"
#   (đổi đường dẫn theo máy của bạn, dùng dấu / )
# ─────────────────────────────────────────────────────────────────────────────

# App mobile mặc định gọi backend ở cổng 8000 (xem appmobile/VF/src/general/apiConfig.ts)
Listen 8000

<VirtualHost *:8000>
    ServerName visionfit.local
    DocumentRoot "${VISIONFIT_BACKEND}/public"

    <Directory "${VISIONFIT_BACKEND}/public">
        Options -Indexes +FollowSymLinks
        # Cho phép public/.htaccess của Laravel định tuyến mọi request về index.php
        AllowOverride All
        Require all granted
    </Directory>

    # Chatbot gọi Gemini có thể mất vài giây; đủ thời gian cho vòng gọi tool (assistant.total_timeout_seconds = 25)
    TimeOut 60

    # Header Authorization (Bearer token) phải được chuyển cho PHP, nếu không API trả 401
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    ErrorLog "logs/visionfit-error.log"
    CustomLog "logs/visionfit-access.log" common
</VirtualHost>
