# ─────────────────────────────────────────────────────────────────────────────
# VisionFit backend — Nginx + PHP-FPM (server Linux khi triển khai thật)
# Đặt tại /etc/nginx/sites-available/visionfit.conf rồi symlink sang sites-enabled.
# Đổi `root` và `fastcgi_pass` cho khớp server.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 8000;
    server_name _;
    root /var/www/visionfit/modules/backend/visionfit/public;
    index index.php;

    charset utf-8;
    client_max_body_size 50M;   # upload video bài tập

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm-visionfit.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        # Chatbot chờ Gemini vài giây; đủ cho vòng gọi tool (assistant.total_timeout_seconds = 25)
        fastcgi_read_timeout 60s;
    }

    # Không bao giờ phục vụ file ẩn (.env, .git ...)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
