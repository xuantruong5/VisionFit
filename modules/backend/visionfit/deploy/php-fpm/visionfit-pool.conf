; ─────────────────────────────────────────────────────────────────────────────
; VisionFit — pool PHP-FPM riêng (server Linux)
; Đặt tại /etc/php/8.2/fpm/pool.d/visionfit.conf rồi: sudo systemctl reload php8.2-fpm
;
; Cách tính số worker: mỗi câu hỏi chatbot giữ 1 worker ~3 giây (chủ yếu chờ Gemini),
; mỗi worker ~40 MB RAM.
;   ~3 câu/giây (1.000 người × 10 câu rải trong 1 giờ)  -> ~10 worker  (~400 MB)
;   ~17 câu/giây (cả lớp hỏi dồn trong 10 phút)          -> ~50 worker  (~2 GB)
; ─────────────────────────────────────────────────────────────────────────────
[visionfit]
user = www-data
group = www-data
listen = /run/php/php8.2-fpm-visionfit.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 50
pm.start_servers = 10
pm.min_spare_servers = 5
pm.max_spare_servers = 20
; Tái tạo worker định kỳ để tránh rò rỉ bộ nhớ
pm.max_requests = 500

; Chatbot có ngân sách 25 giây (assistant.total_timeout_seconds); chặn request treo quá lâu
request_terminate_timeout = 60s

; Cho phép tác vụ nền sau khi đã trả lời (tự cập nhật chỉ mục kho kiến thức) chạy xong
php_admin_value[max_execution_time] = 120
