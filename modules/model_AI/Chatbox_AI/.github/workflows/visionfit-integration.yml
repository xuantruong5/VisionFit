name: VisionFit database integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  laravel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xuantruong5/VisionFit
          ref: f9f349ced2cf79be07e0a325ccc5b416238bea28
          path: .visionfit-source
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - run: node scripts/install-visionfit.js .visionfit-source/modules/backend/visionfit
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: .visionfit-source/modules/backend/visionfit
      - run: cp .env.example .env && php artisan key:generate
        working-directory: .visionfit-source/modules/backend/visionfit
      - run: php artisan test --filter=AssistantApiTest
        working-directory: .visionfit-source/modules/backend/visionfit
